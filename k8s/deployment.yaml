apiVersion: apps/v1
kind: Deployment
metadata:
  name: vstep-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vstep
  template:
    metadata:
      labels:
        app: vstep
    spec:
      containers:
        - name: web
          image: vstep-web
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: vstep-app-config
            - secretRef:
                name: vstep-app-secret
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
