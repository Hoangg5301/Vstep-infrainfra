apiVersion: apps/v1
kind: Deployment
metadata:
  name: vstep-ai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vstep-ai-worker
  template:
    metadata:
      labels:
        app: vstep-ai-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: ai-worker
          image: vstep-tools
          imagePullPolicy: Always
          command: ["./node_modules/.bin/tsx", "scripts/ai-writing-worker.ts"]
          envFrom:
            - configMapRef:
                name: vstep-app-config
            - secretRef:
                name: vstep-app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
