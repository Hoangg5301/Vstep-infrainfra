apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vstep-production
resources:
  - namespace.yaml
  - config-map.yaml
  - deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml
  
images:
  - name: vstep-web
    newName: quangpvvunu/ci_cd_vstep
    newTag: web-latest
  - name: vstep-tools
    newName: quangpvvunu/ci_cd_vstep
    newTag: tools-latest
